<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>Inloggen</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&amp;family=DM+Mono:wght@500&amp;family=Figtree:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F5F8F3;font-family:Figtree,system-ui,sans-serif;color:#0F2420}
a{color:#0A7263}a:hover{color:#075A4E}
button,input{font-family:inherit}
input:focus-visible{outline:3px solid #9CC21F;outline-offset:1px}
</style>
</helmet>
<div style="width: 1440px; height: 900px; box-sizing: border-box; display: grid; grid-template-columns: 1fr 1fr; background: #F5F8F3; color: #0F2420; font-family: Figtree, system-ui, sans-serif">

<div style="position: relative; display: flex; flex-direction: column; justify-content: space-between; padding: 48px 56px; background: #CFF26A; overflow: hidden">
<a href="Main.dc.html" style="display: flex; align-items: center; gap: 10px; text-decoration: none; color: #0F2420">
<svg width="34" height="34" viewBox="0 0 34 34" fill="none" aria-hidden="true"><circle cx="17" cy="17" r="17" fill="#0F2420"></circle><circle cx="11" cy="20" r="5" stroke="#CFF26A" stroke-width="2.4"></circle><circle cx="23" cy="20" r="5" stroke="#CFF26A" stroke-width="2.4"></circle><path d="M11 20l4-8h6l2 8M15 12l4 8" stroke="#CFF26A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"></path></svg>
<span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 22px">BestBikeFit4U</span>
</a>
<svg width="600" height="360" viewBox="0 0 520 340" fill="none" aria-hidden="true" style="align-self: center">
<circle cx="120" cy="240" r="78" stroke="#0F2420" stroke-width="7"></circle>
<circle cx="400" cy="240" r="78" stroke="#0F2420" stroke-width="7"></circle>
<path d="M120 240L230 250L198 120L120 240M198 122L360 114M230 250L368 150M372 160L400 240M360 112L372 160" stroke="#0F2420" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"></path>
<path d="M198 120L192 98M170 96L224 93" stroke="#0F2420" stroke-width="8" stroke-linecap="round"></path>
<path d="M360 112L392 106q26 0 26 24q0 20-18 22" stroke="#0F2420" stroke-width="7" stroke-linecap="round"></path>
<circle cx="230" cy="250" r="13" stroke="#0F2420" stroke-width="6"></circle>
</svg>
<div style="display: flex; flex-direction: column; gap: 12px; max-width: 520px">
<div style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 40px; line-height: 1.05; letter-spacing: -0.02em">Je fit, je fietsen en je voortgang op één plek.</div>
<div style="font-size: 17px; line-height: 1.5; color: #1F3A34">Bewaar je maten, vergelijk met je huidige afstelling en zie wat je als volgende aanpast.</div>
</div>
</div>

<div style="display: flex; align-items: center; justify-content: center; padding: 48px">
<div style="width: 440px; display: flex; flex-direction: column; gap: 24px">
<div role="tablist" aria-label="Account" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; padding: 5px; border-radius: 16px; background: #E6ECE8">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="2">
<button type="button" role="tab" aria-selected="{{t.sel}}" onClick="{{t.pick}}" style="height: 46px; border: 0; border-radius: 12px; background: {{t.bg}}; color: {{t.fg}}; font-size: 15px; font-weight: 700; cursor: pointer; box-shadow: {{t.shadow}}">{{t.label}}</button>
</sc-for>
</div>

<div>
<h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 40px; letter-spacing: -0.02em">{{title}}</h1>
<p style="margin: 8px 0 0; color: #4A5F5A; font-size: 16px">{{sub}}</p>
</div>

<button type="button" style="display: flex; align-items: center; justify-content: center; gap: 12px; height: 54px; border-radius: 14px; border: 1px solid #C9D6D0; background: #FFFFFF; color: #0F2420; font-size: 16px; font-weight: 600; cursor: pointer">
<span aria-hidden="true" style="display: flex; align-items: center; justify-content: center; width: 26px; height: 26px; border-radius: 50%; border: 2px solid #0F2420; font-weight: 800; font-size: 14px">G</span>Doorgaan met Google</button>

<div style="display: flex; align-items: center; gap: 12px; color: #4A5F5A; font-size: 14px"><span style="flex-grow: 1; height: 1px; background: #DCE6E1"></span>of met e-mail<span style="flex-grow: 1; height: 1px; background: #DCE6E1"></span></div>

<div style="display: flex; flex-direction: column; gap: 16px">
<sc-if value="{{signup}}" hint-placeholder-val="{{false}}">
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="li-name" style="font-weight: 600; font-size: 15px">Voornaam</label>
<input id="li-name" type="text" placeholder="Bijv. Lisa" style="height: 52px; padding: 0 16px; border-radius: 14px; border: 1px solid #C9D6D0; background: #FFFFFF; font-size: 16px; color: #0F2420">
</div>
</sc-if>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="li-mail" style="font-weight: 600; font-size: 15px">E-mailadres</label>
<input id="li-mail" type="email" placeholder="jij@voorbeeld.nl" style="height: 52px; padding: 0 16px; border-radius: 14px; border: 1px solid #C9D6D0; background: #FFFFFF; font-size: 16px; color: #0F2420">
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<div style="display: flex; justify-content: space-between"><label for="li-pw" style="font-weight: 600; font-size: 15px">Wachtwoord</label><a href="#" style="font-size: 14px; font-weight: 600">Wachtwoord vergeten?</a></div>
<input id="li-pw" type="password" placeholder="••••••••" style="height: 52px; padding: 0 16px; border-radius: 14px; border: 1px solid #C9D6D0; background: #FFFFFF; font-size: 16px; color: #0F2420">
</div>
</div>

<a href="Dashboard.dc.html" style="display: flex; align-items: center; justify-content: center; height: 56px; border-radius: 999px; background: #0A7263; color: #FFFFFF; font-weight: 700; font-size: 17px; text-decoration: none">{{cta}}</a>
<p style="margin: 0; font-size: 14px; color: #4A5F5A; text-align: center">Nog aan het kijken? <a href="BikeFit.dc.html" style="font-weight: 700">Probeer de calculator zonder account</a></p>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { tab: 0 }; }
  renderVals() {
    const t = this.state.tab;
    const tabs = ['Inloggen', 'Account aanmaken'].map((label, i) => ({
      label: label, sel: String(t === i),
      bg: t === i ? '#FFFFFF' : 'transparent', fg: t === i ? '#0F2420' : '#3B4F4A',
      shadow: t === i ? '0 1px 4px rgba(15,36,32,.18)' : 'none',
      pick: () => this.setState({ tab: i })
    }));
    return {
      tabs: tabs, signup: t === 1,
      title: t === 0 ? 'Welkom terug' : 'Maak je gratis account',
      sub: t === 0 ? 'Log in om verder te gaan met je fit.' : 'Gratis, geen creditcard nodig.',
      cta: t === 0 ? 'Inloggen' : 'Account aanmaken'
    };
  }
}
</script>
</body>
</html>
